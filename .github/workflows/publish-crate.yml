name: Publish Weavatrix crate

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      authentication:
        description: "Use bootstrap-token only for the first crates.io release; use trusted-publishing afterwards"
        type: choice
        required: true
        default: trusted-publishing
        options:
          - trusted-publishing
          - bootstrap-token

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

concurrency:
  group: publish-crate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sergii-ziborov/weavatrix'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 2026-07-29
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - name: Verify package identity
        shell: bash
        run: |
          NAME="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].name')"
          [[ "$NAME" == "weavatrix" ]]
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Verify architecture
        shell: bash
        run: |
          cargo run --quiet --locked -- tool verify_architecture . |
            jq -e '.state == "PASS" and (.new | length) == 0 and (.existing | length) == 0 and (.excepted | length) == 0'
      - run: cargo publish --locked --dry-run
      - name: Check immutable registry version
        id: registry
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if cargo info --color never --registry crates-io "weavatrix@$VERSION" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io trusted publishing
        if: steps.registry.outputs.published != 'true' && ((github.event_name == 'push' && env.BOOTSTRAP_CARGO_REGISTRY_TOKEN == '') || inputs.authentication == 'trusted-publishing')
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish with a short-lived OIDC token
        if: steps.registry.outputs.published != 'true' && ((github.event_name == 'push' && env.BOOTSTRAP_CARGO_REGISTRY_TOKEN == '') || inputs.authentication == 'trusted-publishing')
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo publish --locked --no-verify
      - name: Bootstrap the first release with a repository secret
        if: steps.registry.outputs.published != 'true' && ((github.event_name == 'push' && env.BOOTSTRAP_CARGO_REGISTRY_TOKEN != '') || inputs.authentication == 'bootstrap-token')
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.BOOTSTRAP_CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || { echo "CARGO_REGISTRY_TOKEN is required only for the first publish" >&2; exit 1; }
          cargo publish --locked --no-verify
          echo "::warning::Configure this workflow as a trusted publisher on crates.io, then remove CARGO_REGISTRY_TOKEN."
      - name: Verify crates.io artifact
        shell: bash
        run: |
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          for attempt in $(seq 1 24); do
            echo "crates.io verification attempt $attempt/24"
            if cargo info --color never --registry crates-io "weavatrix@$VERSION" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "weavatrix@$VERSION did not become visible on crates.io" >&2
          exit 1
