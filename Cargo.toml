[package]
name = "weavatrix"
version = "1.5.0"
edition = "2024"
rust-version = "1.89"
description = "Native MCP server for Weavatrix repository intelligence: 42 read-only evidence, impact, architecture, API, Git, search, semantic, and memory operations"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix"
readme = "README.md"
documentation = "https://github.com/sergii-ziborov/weavatrix/tree/main/docs"
keywords = ["mcp", "repository", "code-graph", "static-analysis", "coding-agents"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "/src/**",
    "/.weavatrix/architecture.json",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/docs/**",
]

[[bin]]
name = "weavatrix"
path = "src/main.rs"

[dependencies]
blazingly-json = "0.1.0"
mcport = "0.5.0"
notify = "8.2.0"
weavatrix-rust = { version = "2.4.0", features = ["full", "lang-rust"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
